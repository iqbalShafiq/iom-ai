services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iom
      POSTGRES_PASSWORD: iom
      POSTGRES_DB: iom
    ports:
      - "5432:5432"
    volumes:
      - iom-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iom -d iom"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - iom-qdrant:/qdrant/storage

volumes:
  iom-postgres:
  iom-qdrant:

