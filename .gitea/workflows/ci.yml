name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iom
          POSTGRES_PASSWORD: iom
          POSTGRES_DB: iom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://iom:iom@localhost:5432/iom_test
      COOKIE_SECRET: ci-cookie-secret-at-least-32-characters
      VITE_API_URL: http://localhost:3001
      OPENAI_API_KEY: test-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm branch:check
      - run: pnpm db:generate
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

